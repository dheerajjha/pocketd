# The Xcode project is generated, not committed. A .xcodeproj is a merge-conflict
# generator that hides its own diffs; this file is the reviewable source of truth.
# Run `xcodegen generate` (or `make app`) after changing it.
name: Pocketd

options:
  bundleIdPrefix: dev.pocketd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PocketdKit:
    path: .
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    from: 0.5.0

targets:
  Pocketd:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocketd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required since iOS 14 for any app that listens on or scans the LAN.
        # Without it the listening socket accepts nothing from other devices and
        # fails silently, which is the single most confusing way for this app to
        # break.
        # Everything here is plain HTTP on a private address by design. Without
        # this exception App Transport Security blocks the app's own requests to
        # local hosts, which is how the in-app diagnostics fail on a device but
        # not in the simulator.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Required to advertise over Bonjour. Without these exact service types
        # publish fails silently and the phone is discoverable by nothing.
        NSBonjourServices:
          - _pocketd._tcp
          - _ollama._tcp
        NSLocalNetworkUsageDescription: >-
          Pocketd serves the language model running on this device to other
          devices on your network. Everything stays on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketd.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 83C822A4J3
        CODE_SIGN_STYLE: Automatic
        # Indirection so a device build can drop the entitlement without
        # editing this file. Overriding CODE_SIGN_ENTITLEMENTS directly on the
        # xcodebuild command line applies it to every target in the graph,
        # including LocalLLMClient's, which then fail on a path relative to the
        # wrong project. A custom variable is ignored by targets that do not
        # reference it. See `make device-install`.
        # The file is committed rather than generated: XcodeGen's entitlements:
        # block writes CODE_SIGN_ENTITLEMENTS onto the target, which then wins
        # over this indirection and makes the override below a no-op.
        POCKETD_ENTITLEMENTS: $(SRCROOT)/App/Resources/Pocketd.entitlements
        CODE_SIGN_ENTITLEMENTS: $(POCKETD_ENTITLEMENTS)
        SWIFT_STRICT_CONCURRENCY: complete
        # LocalLLMClientLlama is built with .interoperabilityMode(.Cxx), and a
        # target that links it has to agree. Without this the llama.cpp headers
        # are compiled as C and fail on `#include <memory>`, which reads as a
        # missing-file error rather than a settings mismatch. Found in
        # LocalLLMClient's own Example project, not in its README.
        SWIFT_OBJC_INTEROP_MODE: objcxx
    dependencies:
      - package: PocketdKit
        product: PocketdKit
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
