# The Xcode project is generated, not committed. A .xcodeproj is a merge-conflict
# generator that hides its own diffs; this file is the reviewable source of truth.
# Run `xcodegen generate` (or `make app`) after changing it.
name: Pocketd

options:
  bundleIdPrefix: dev.pocketd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PocketdKit:
    path: .
  # By revision, not by version, and that is forced rather than chosen.
  # LocalLLMClientLlama passes -Xlinker rpath flags through to llama.cpp, and
  # SwiftPM refuses to let a *version*-based dependency carry unsafe flags:
  #
  #   error: The package product 'LocalLLMClientLlama-product' cannot be used
  #   as a dependency of this target because it uses unsafe build flags.
  #
  # `from: 0.5.0` therefore could not build the app target from a clean
  # checkout at all — the only reason it ever worked here was a derived-data
  # directory resolved before the rule bit, and deleting that took the app
  # build with it. A revision requirement lifts the restriction, and this SHA
  # *is* 0.5.0, so what gets compiled has not moved. It is also the stronger
  # pin the comments elsewhere already claimed this was.
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    revision: edc39ef2ffc1cef9cf856b0788de8d331f776c2e

targets:
  Pocketd:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Named as one file rather than adding App/Resources wholesale. That
      # directory also holds Info.plist and the two .entitlements files, and
      # copying those in would ship the entitlements as a readable resource and
      # give the target a second Info.plist competing with the generated one.
      #
      # App Store Connect looks for the manifest at the root of the .app, which
      # is where a plain resource copy puts it. Get this wrong and nothing
      # fails locally — the app builds, installs and runs — and the first sign
      # is ITMS-91053 rejecting the upload.
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Named explicitly for the same reason, and it must be the catalogue
      # rather than the PNG: an app icon copied in as a loose resource is not
      # an app icon, it is a file in the bundle, and the home screen shows the
      # grey placeholder.
      - path: App/Resources/Assets.xcassets
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocketd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Declared here so it is answered once, in the repo, rather than as a
        # manual question in App Store Connect on every single upload — and so
        # the answer is reviewable next to the reasoning for it.
        #
        # False is the correct answer, and it is not "we do no encryption".
        # The app is a TLS *client* (Hugging Face downloads over HTTPS through
        # URLSession) and its own LAN server speaks plain HTTP. Encryption
        # reached only through Apple's own APIs is exempt under the standard
        # exemption, and nothing here ships a cryptographic implementation of
        # its own. The API key the server requires is a shared secret compared
        # in constant time, not encryption.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required since iOS 14 for any app that listens on or scans the LAN.
        # Without it the listening socket accepts nothing from other devices and
        # fails silently, which is the single most confusing way for this app to
        # break.
        # Everything here is plain HTTP on a private address by design. Without
        # this exception App Transport Security blocks the app's own requests to
        # local hosts, which is how the in-app diagnostics fail on a device but
        # not in the simulator.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Full access, not write-only: these tools read and never write. On
        # iOS 17+ a calendar read with only NSCalendarsWriteOnlyAccessUsage-
        # Description present returns an empty list rather than an error, which
        # looks exactly like a free day.
        # The wording says where the data goes because that is the honest and
        # unusual part of this app: the model doing the reading is a file on
        # this phone, and no request leaves the device to answer.
        NSCalendarsFullAccessUsageDescription: >-
          Pocketd lets the AI assistant running on this iPhone answer questions
          about your schedule, such as what is on today. Your events are read on
          this device only, are never uploaded, and are never sent to the other
          devices this app serves.
        NSRemindersFullAccessUsageDescription: >-
          Pocketd lets the AI assistant running on this iPhone answer questions
          about your reminders, such as what is overdue. Your reminders are read
          on this device only, are never uploaded, and are never sent to the
          other devices this app serves.
        # Both are required, and the app crashes on requestAuthorization if
        # either is missing — not a warning, a termination. The write string is
        # present because HealthKit demands it whenever the framework is linked,
        # even though nothing here writes: the read tools are read-only and the
        # share set passed to requestAuthorization is empty.
        NSHealthShareUsageDescription: >-
          Pocketd lets the AI assistant running on this iPhone answer questions
          about your activity, heart and sleep, such as how last night compares
          with your usual. Your health data is read on this device only, is
          never uploaded, and is never sent to the other devices this app
          serves.
        NSHealthUpdateUsageDescription: >-
          Pocketd does not write to Health. This permission is requested only
          because iOS requires the description to be present whenever an app
          links HealthKit.
        # Required to advertise over Bonjour. Without these exact service types
        # publish fails silently and the phone is discoverable by nothing.
        NSBonjourServices:
          - _pocketd._tcp
          - _ollama._tcp
        NSLocalNetworkUsageDescription: >-
          Pocketd serves the language model running on this device to other
          devices on your network. Everything stays on your local network.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.pocketd.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 83C822A4J3
        CODE_SIGN_STYLE: Automatic
        # Indirection so a device build can drop the entitlement without
        # editing this file. Overriding CODE_SIGN_ENTITLEMENTS directly on the
        # xcodebuild command line applies it to every target in the graph,
        # including LocalLLMClient's, which then fail on a path relative to the
        # wrong project. A custom variable is ignored by targets that do not
        # reference it. See `make device-install`.
        # The file is committed rather than generated: XcodeGen's entitlements:
        # block writes CODE_SIGN_ENTITLEMENTS onto the target, which then wins
        # over this indirection and makes the override below a no-op.
        POCKETD_ENTITLEMENTS: $(SRCROOT)/App/Resources/Pocketd.entitlements
        CODE_SIGN_ENTITLEMENTS: $(POCKETD_ENTITLEMENTS)
        SWIFT_STRICT_CONCURRENCY: complete
        # LocalLLMClientLlama is built with .interoperabilityMode(.Cxx), and a
        # target that links it has to agree. Without this the llama.cpp headers
        # are compiled as C and fail on `#include <memory>`, which reads as a
        # missing-file error rather than a settings mismatch. Found in
        # LocalLLMClient's own Example project, not in its README.
        SWIFT_OBJC_INTEROP_MODE: objcxx
    dependencies:
      - package: PocketdKit
        product: PocketdKit
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama

# A shared scheme, on disk and in git's view of the world.
#
# Without one, `xcodebuild -scheme Pocketd` still works — it synthesises a
# scheme in memory — but Xcode.app opens the project with an empty scheme
# picker, and anything that needs a scheme (previews, profiling, a fresh
# clone's first Run) has nothing to select. That is a worse first five
# minutes than it sounds, and it is one block of YAML.
schemes:
  Pocketd:
    build:
      targets:
        Pocketd: all
    run:
      config: Debug
    # No test targets here: the suite is the Swift package's, run with
    # `swift test`, and it deliberately does not need a simulator.
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
